[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "surrogatenn-dsge"
version = "0.1.0"
description = "A gradual Python/JAX port of MacroModelling-style DSGE tooling."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Matyas Farkas"},
]
keywords = [
  "dsge",
  "jax",
  "macroeconomics",
  "numpyro",
  "surrogate-models",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "scipy>=1.10,<2",
  "sympy>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/matyasfarkas/SurrogateNN_DSGE"
Repository = "https://github.com/matyasfarkas/SurrogateNN_DSGE"
Documentation = "https://github.com/matyasfarkas/SurrogateNN_DSGE/tree/main/docs"

[project.optional-dependencies]
inference = [
  "numpyro>=0.19,<0.22",
]
benchmarks = [
  "numpyro>=0.19,<0.22",
  "tomli>=1.1; python_version<'3.11'",
]
notebooks = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "matplotlib>=3.8",
  "numpyro>=0.19,<0.22",
]
dev = [
  "build>=1.2,<2",
  "numpyro>=0.19,<0.22",
  "pytest>=8.0,<9",
  "tomli>=1.1; python_version<'3.11'",
  "twine>=6.0,<7",
]
cuda12 = [
  "jax[cuda12]>=0.6",
]
cuda13 = [
  "jax[cuda13]>=0.6",
]

[project.scripts]
surrogatenn-dsge = "surrogatenn_dsge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/surrogatenn_dsge"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/CHANGELOG.md",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/benchmarks",
  "/docs",
  "/notebooks",
  "/scripts",
]
exclude = [
  "/benchmarks/results",
  "/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
